<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="apRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea0519" />
      <stop offset="50%" stop-color="#d90416" />
      <stop offset="100%" stop-color="#9b020e" />
    </linearGradient>
    <linearGradient id="apAccentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="apShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#apRedGrad)" />
  <rect width="512" height="512" rx="128" fill="url(#apAccentGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.2" />

  <!-- Dynamic AP FLOW Geometric Monogram -->
  <g filter="url(#apShadow)">
    <!-- Main "A" Left Slanted Wing -->
    <path d="M 172 384 L 236 128 L 290 128 L 226 384 Z" fill="#ffffff" />
    
    <!-- Flow Speed Chevrons / Crossbar in Dark Slate -->
    <path d="M 160 300 L 350 300 L 332 342 L 142 342 Z" fill="#18181b" />
    
    <!-- Main "P" Upper Loop in Pure White with aerodynamic slant -->
    <path d="M 276 128 L 366 128 C 418 128 444 158 436 206 C 428 254 390 284 336 284 L 246 284 L 276 128 Z M 304 172 L 292 240 L 336 240 C 362 240 380 224 384 200 C 388 178 376 172 352 172 Z" fill="#ffffff" />

    <!-- Red dynamic notch cut inside P -->
    <polygon points="340,186 372,186 360,224 328,224" fill="url(#apRedGrad)" />
  </g>

  <!-- Small energetic dot in bright white/silver -->
  <circle cx="410" cy="360" r="18" fill="#ffffff" />
</svg>